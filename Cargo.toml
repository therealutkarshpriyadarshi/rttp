[package]
name = "pttp"
version = "0.1.0"
edition = "2021"
authors = ["PTTP Contributors"]
description = "Pure Rust Web Framework with AI/LLM Integration - Learning Project"
license = "MIT"

[lib]
name = "pttp"
path = "src/lib.rs"

[dependencies]
# Async runtime (essential)
tokio = { version = "1", features = ["full"] }

# Serialization (essential)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging infrastructure
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID generation for request IDs
uuid = { version = "1", features = ["v4"] }

# Database support (Phase 3)
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
postgres-types = { version = "0.2", features = ["derive"] }

# Security (Phase 4)
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"

# Async traits
async-trait = "0.1"

# Compression (Phase 5)
flate2 = "1.0"
brotli = "6.0"

# Real-time features (Phase 6)
sha1 = "0.10"

# Background processing (Phase 7)
num_cpus = "1.16"
chrono = "0.4"

# AI/LLM integration (Phase 8)
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
bytes = "1.11"
regex = "1.10"

[dev-dependencies]
# Testing utilities
tokio-test = "0.4"
chrono = "0.4"

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "phase2_demo"
path = "examples/phase2_demo.rs"

[[example]]
name = "phase3_demo"
path = "examples/phase3_demo.rs"

[[example]]
name = "phase4_demo"
path = "examples/phase4_demo.rs"

[[example]]
name = "phase5_demo"
path = "examples/phase5_demo.rs"

[[example]]
name = "phase6_demo"
path = "examples/phase6_demo.rs"

[[example]]
name = "phase7_demo"
path = "examples/phase7_demo.rs"

[[example]]
name = "phase8_demo"
path = "examples/phase8_demo.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package]
name = "pttp"
version = "0.1.0"
edition = "2021"
authors = ["PTTP Contributors"]
description = "Pure Rust Web Framework with AI/LLM Integration - Learning Project"
license = "MIT"

[lib]
name = "pttp"
path = "src/lib.rs"

[dependencies]
# Async runtime (essential)
tokio = { version = "1", features = ["full"] }

# Serialization (essential)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging infrastructure
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID generation for request IDs
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Testing utilities
tokio-test = "0.4"

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "phase2_demo"
path = "examples/phase2_demo.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Rustfmt configuration for PTTP

# Edition
edition = "2021"

# Maximum width of each line
max_width = 100

# Maximum width of comments
comment_width = 80

# Ideal width for the code body
use_small_heuristics = "Default"

# Format strings
format_strings = true

# Use field init shorthand
use_field_init_shorthand = true

# Merge imports
imports_granularity = "Crate"

# Group imports
group_imports = "StdExternalCrate"

# Reorder imports
reorder_imports = true

# Reorder modules
reorder_modules = true

# Control flow indentation
indent_style = "Block"

# Trailing commas
trailing_comma = "Vertical"

# Match block trailing comma
match_block_trailing_comma = true

# Blank lines upper bound
blank_lines_upper_bound = 1

# Blank lines lower bound
blank_lines_lower_bound = 0

# Newline style
newline_style = "Unix"

# Where to put the opening brace of items
brace_style = "SameLineWhere"

# Where to put the opening brace of control flow
control_brace_style = "AlwaysSameLine"

# Format macro bodies
format_macro_bodies = true

# Format macro matchers
format_macro_matchers = true

# Use try shorthand
use_try_shorthand = true

# Normalize comments
normalize_comments = true

# Normalize doc attributes
normalize_doc_attributes = true

# Wrap comments
wrap_comments = true

# Format code in doc comments
format_code_in_doc_comments = true
